<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reroll</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root {
  --bg: #faf9f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e1dc;
  --accent: #3b5bdb; --user: #eef1fb; --soft: #f2f1ee;
  --same: #2b8a3e; --open_moves: #1971c2; --interpretation: #d9480f; --contradiction: #c92a2a; --syc: #9c36b5;
  --uniform: #2b8a3e; --mostly: #0c8599; --split: #e67700; --divergent: #e03131;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --text: #e8e8ea; --muted: #9a9aa0; --border: #34343a;
    --accent: #748ffc; --user: #262b3b; --soft: #26262a;
    --same: #51cf66; --open_moves: #4dabf7; --interpretation: #ffa94d; --contradiction: #ff6b6b; --syc: #da77f2;
    --uniform: #51cf66; --mostly: #3bc9db; --split: #ffa94d; --divergent: #ff6b6b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 4px 10px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: white; }
button.link { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 13px; }
button.link:hover { color: var(--accent); }
textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; width: 100%; resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); }

#sidebar { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
#sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 4px 6px; }
.session-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.session-item:hover { background: var(--soft); }
.session-item.active { background: var(--user); }
.session-item .date { color: var(--muted); font-size: 12px; }
.session-item .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar { border-bottom: 1px solid var(--border); padding: 8px 20px; font-size: 13px; color: var(--muted);
  display: flex; gap: 12px; align-items: flex-start; }
#topbar details { flex: 1; }
a.button { font-size: 13px; text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  padding: 2px 10px; background: var(--panel); }
a.button:hover { border-color: var(--accent); }
body.export #sidebar, body.export #composer { display: none; }
body.export #topbar { flex-direction: column; gap: 4px; }
.export-note { color: var(--text); font-size: 14px; }
.prompt { white-space: pre-wrap; margin: 6px 0; font: inherit; }
#topbar details textarea { margin-top: 6px; min-height: 120px; }
#topbar summary { cursor: pointer; }
#chat { flex: 1; overflow-y: auto; }
#chat-inner { max-width: 820px; margin: 0 auto; padding: 20px; }
#composer { border-top: 1px solid var(--border); padding: 10px 20px 14px; }
#composer-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#composer textarea { resize: none; max-height: 240px; }

.turn { margin-bottom: 28px; }
.user-msg { background: var(--user); border-radius: 10px; padding: 10px 14px; margin-left: 60px; white-space: pre-wrap;
  position: relative; }
.user-msg.long { max-height: 220px; overflow-y: auto; }
.msg-actions { text-align: right; margin-top: 2px; }
.earlier { margin: 4px 0 0 60px; font-size: 13px; color: var(--muted); }
.earlier summary { cursor: pointer; }
.earlier .version { border-left: 2px solid var(--border); padding-left: 8px; margin: 6px 0; white-space: pre-wrap; }
.assistant { margin-top: 14px; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md pre { background: var(--soft); padding: 8px; border-radius: 6px; overflow-x: auto; }

.label { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--soft); font-size: 13.5px; cursor: pointer;
  border-left: 3px solid var(--muted); }
.label:hover { outline: 1px solid var(--border); }
.label .spread { font-weight: 600; color: var(--spread); }
.label .kind.warn-interpretation { font-weight: 600; color: var(--interpretation); }
.label .kind.warn-contradiction { font-weight: 600; color: var(--contradiction); }
.bar { display: inline-flex; gap: 2px; width: 56px; height: 9px; margin-right: 7px; vertical-align: 0; }
.bar span { background: var(--spread); border-radius: 2px; }
.label .meta { color: var(--muted); }
.label .minority { color: var(--interpretation); font-weight: 600; }
.label .line { margin-top: 3px; }
.label .syc { color: var(--syc); font-weight: 600; }
.label .err { color: var(--contradiction); }
.label.pending { cursor: default; color: var(--muted); }
.label.pending.partial { cursor: pointer; }
.kind-contradiction { border-left-color: var(--contradiction); }
.spread-uniform { --spread: var(--uniform); } .spread-mostly { --spread: var(--mostly); }
.spread-split { --spread: var(--split); } .spread-divergent { --spread: var(--divergent); }
.label[class*="spread-"] { border-left-color: var(--spread); }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

#welcome h1 { font-size: 22px; margin: 20px 0 6px; }
#welcome p { color: var(--muted); margin-top: 0; }
#welcome textarea { min-height: 260px; margin: 8px 0; }

#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1100px, 75vw); background: var(--panel);
  border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.12); overflow-y: auto; padding: 16px 20px;
  transform: translateX(105%); transition: transform .18s ease; }
#drawer.open { transform: none; }
#drawer .head { display: flex; justify-content: space-between; align-items: center; }
#drawer .quote { border-left: 3px solid var(--accent); padding: 4px 10px; white-space: pre-wrap; max-height: 140px;
  overflow-y: auto; color: var(--muted); margin: 8px 0 12px; }
.groups { margin: 8px 0; }
.group { margin: 3px 0; }
.chip { display: inline-block; min-width: 20px; text-align: center; border-radius: 4px; font-weight: 600; font-size: 12px;
  padding: 0 5px; margin-right: 6px; color: white; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-top: 14px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .card-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted);
  margin-bottom: 6px; gap: 8px; }
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: .92; }
</style>
</head>
<body>
<aside id="sidebar">
  <button class="primary" id="new-btn" style="width:100%">New session</button>
  <h2>Sessions</h2>
  <div id="sessions"></div>
</aside>
<main>
  <div id="topbar"></div>
  <div id="chat"><div id="chat-inner"></div></div>
  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" rows="1" placeholder="Message (Enter sends, Shift+Enter for a new line)"></textarea>
      <button class="primary" id="send-btn">Send</button>
    </div>
  </div>
</main>
<aside id="drawer"></aside>
<div id="toast"></div>

<script>window.REROLL_EXPORT = {"session":{"id":"sanitized-product-beta-demo","model":"anthropic:claude-sonnet-5","judge_model":"anthropic:claude-haiku-4-5","n":3,"system_prompt":"You are a pragmatic product adviser. State assumptions and trade-offs clearly.","backend":"cli","turns":[{"user_message":"We're considering whether to launch a small beta now or wait until onboarding is automated. What would you do?","system_prompt":"You are a pragmatic product adviser. State assumptions and trade-offs clearly.","samples":[{"text":"I would launch a **small, explicitly manual beta now**. Cap it at 10 design partners, tell them onboarding is concierge-style, and use those sessions to learn which steps are actually worth automating. Set a two-week checkpoint with exit criteria: activation rate, support time per account, and the top repeated friction points.","seconds":8.2,"input_tokens":142,"output_tokens":78,"cache_read_tokens":0,"cache_write_tokens":0,"cli_session_id":null},{"text":"I would wait one short sprint\u2014but only to automate the single onboarding step most likely to block adoption. Define a one-week deadline, ship that narrow improvement, then open the beta. This reduces avoidable first-impression damage without turning 'better onboarding' into an indefinite launch condition.","seconds":7.6,"input_tokens":142,"output_tokens":67,"cache_read_tokens":0,"cache_write_tokens":0,"cli_session_id":null},{"text":"Launch now to a deliberately small cohort and treat manual onboarding as research. Record where each participant stalls, how long assistance takes, and what language confuses them. Automate only after three or more users hit the same bottleneck; otherwise you risk polishing a flow before you know what matters.","seconds":8.8,"input_tokens":142,"output_tokens":73,"cache_read_tokens":0,"cache_write_tokens":0,"cli_session_id":null}],"errors":[],"chosen":0,"waiting_for_chosen":false,"divergence":{"groups":[{"label":"Launch a small manual beta","members":[1,3]},{"label":"Delay briefly for one automation","members":[2]}],"kind":"open_moves","summary":"Two replies favor a limited beta with manual onboarding; one recommends a short delay to automate the riskiest step.","clarification":null,"sycophancy":null},"judge_error":null,"spread":"split","earlier":[]}]},"busy":false,"phase":null};</script>
<script>
// Set in exported files: a read-only page with one session embedded, no server needed.
const EXPORT = window.REROLL_EXPORT || null;
const KINDS = {
  same: "consistent",
  open_moves: "different next moves",
  interpretation: "read you differently",
  contradiction: "contradicting each other",
};
const SPREAD_CLASS = { "uniform": "uniform", "mostly uniform": "mostly", "split": "split", "highly divergent": "divergent" };
const GROUP_COLORS = ["#3b5bdb", "#d9480f", "#2b8a3e", "#9c36b5", "#c2255c", "#0c8599", "#5c940d", "#e67700", "#495057"];

const $ = (sel) => document.querySelector(sel);
let config = null, state = null, lastJson = "", pollTimer = null;
let showWelcome = false, editing = false, drawerTurn = null, scrollToBottom = false, renderedPrompt = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => DOMPurify.sanitize(marked.parse(s || ""));
const letter = (g) => String.fromCharCode(65 + g);

function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 4000);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    toast(data.detail || res.statusText);
    throw new Error(data.detail || res.statusText);
  }
  return data;
}

function apply(data) {
  const json = JSON.stringify(data);
  if (json !== lastJson) {
    lastJson = json;
    state = data;
    render();
  }
  clearTimeout(pollTimer);
  if (data.busy) pollTimer = setTimeout(refresh, 1000);
  else if (state.session) loadSessions();
}

async function refresh() {
  try {
    apply(await api("GET", "/api/session"));
  } catch (e) {
    pollTimer = setTimeout(refresh, 3000);
  }
}

async function loadSessions() {
  const sessions = await api("GET", "/api/sessions");
  const current = state?.session?.id;
  $("#sessions").innerHTML = sessions.map((s) => `
    <div class="session-item ${s.id === current ? "active" : ""}" data-id="${esc(s.id)}">
      <div class="date">${esc(new Date(s.started).toLocaleString())} · ${s.turns} turn${s.turns === 1 ? "" : "s"}</div>
      <div class="preview">${esc(s.preview) || "<i>empty</i>"}</div>
    </div>`).join("");
}

// ---------- rendering ----------

function groupOf(d, sampleIndex) {
  if (!d) return null;
  const g = d.groups.findIndex((group) => group.members.includes(sampleIndex + 1));
  return g < 0 ? null : { index: g, size: d.groups[g].members.length };
}

// How much the samples agree (bar + colored word), then what kind of divergence it is.
function verdictHtml(turn) {
  const d = turn.divergence;
  const sizes = d.groups.map((g) => g.members.length).sort((a, b) => b - a);
  const bar = `<span class="bar">${sizes.map((size) => `<span style="flex:${size}"></span>`).join("")}</span>`;
  const warn = d.kind === "interpretation" || d.kind === "contradiction" ? `warn-${d.kind}` : "";
  const kind = d.kind === "same" ? "" : ` · <span class="kind ${warn}">${KINDS[d.kind]}</span>`;
  return `${bar}<span class="spread">${turn.spread}</span>${kind}`;
}

function labelHtml(turn, i) {
  const s = state.session;
  const isLast = i === s.turns.length - 1;
  const n = turn.samples.length;
  if (isLast && state.busy) {
    const finished = n + turn.errors.length;
    let text;
    if (state.phase === "judging") text = `${n} samples · judging`;
    else text = `${finished}/${s.n} samples done${turn.errors.length ? ` (${turn.errors.length} failed)` : ""}`;
    // Finished samples can be read before the rest are in; groups come after judging.
    return n
      ? `<div class="label pending partial" data-turn="${i}"><span class="dots">${text}</span> <span class="meta">· click to read them</span></div>`
      : `<div class="label pending"><span class="dots">${text}</span></div>`;
  }
  if (!n) {
    return `<div class="label kind-contradiction"><span class="err">All samples failed:</span> ${esc(turn.errors[0] || "unknown error")}</div>`;
  }
  const d = turn.divergence;
  let html;
  if (d) {
    const mine = groupOf(d, turn.chosen);
    const largest = Math.max(...d.groups.map((g) => g.members.length));
    let minority = "";
    if (mine && mine.size < largest) {
      // With different next moves, a minority reply is just a less common direction, not a red flag.
      minority = d.kind === "interpretation" || d.kind === "contradiction"
        ? `<span class="minority"> · you got a minority reply (${mine.size}/${n})</span>`
        : `<span class="meta"> · less common direction (${mine.size}/${n})</span>`;
    }
    html = `<div class="label spread-${SPREAD_CLASS[turn.spread]}" data-turn="${i}">
      ${verdictHtml(turn)}
      <span class="meta"> · ${d.groups.length} group${d.groups.length === 1 ? "" : "s"} in ${n} samples</span>
      ${minority}
      <div class="line">${esc(d.summary)}</div>
      ${d.clarification ? `<div class="line"><b>Try adding:</b> <i>${esc(d.clarification)}</i></div>` : ""}
      ${d.sycophancy ? `<div class="line"><span class="syc">Sycophancy?</span> ${esc(d.sycophancy)}</div>` : ""}`;
  } else {
    const reason = turn.judge_error ? `<span class="err">Judge failed:</span> ${esc(turn.judge_error)}` : "Only one sample succeeded, nothing to compare.";
    html = `<div class="label" data-turn="${i}">${reason}`;
  }
  if (turn.errors.length) html += `<div class="line err">${turn.errors.length} sample(s) failed: ${esc(turn.errors[0])}</div>`;
  return html + "</div>";
}

function turnHtml(turn, i) {
  const s = state.session;
  const isLast = i === s.turns.length - 1;
  let user;
  if (isLast && editing) {
    user = `<div style="margin-left:60px">
      <textarea id="edit-input" rows="6">${esc(turn.user_message)}</textarea>
      <div class="msg-actions"><button id="edit-cancel">Cancel</button> <button class="primary" id="edit-send">Resample with this</button></div>
    </div>`;
  } else {
    const long = turn.user_message.length > 1200 ? "long" : "";
    user = `<div class="user-msg ${long}">${esc(turn.user_message)}</div>`;
    if (isLast && !state.busy && !EXPORT) {
      user += `<div class="msg-actions"><button class="link" id="edit-btn">Edit</button><button class="link" id="resample-btn">Resample</button></div>`;
    }
  }
  const earlier = turn.earlier.length ? `<details class="earlier"><summary>${turn.earlier.length} earlier version${turn.earlier.length === 1 ? "" : "s"}</summary>
    ${turn.earlier.map((e) => `<div class="version">${esc(e.user_message)}<br><b>${e.kind ? KINDS[e.kind] : "no judgement"}</b>${e.summary ? ": " + esc(e.summary) : ""}</div>`).join("")}
  </details>` : "";
  const body = turn.samples.length && !turn.waiting_for_chosen ? `<div class="md">${md(turn.samples[turn.chosen].text)}</div>` : "";
  return `<div class="turn">${user}${earlier}<div class="assistant">${body}${labelHtml(turn, i)}</div></div>`;
}

function welcomeHtml() {
  const prompt = state?.session?.system_prompt ?? config.default_system_prompt;
  return `<div id="welcome">
    <h1>New session</h1>
    <p>${esc(config.model)} · ${config.n} samples per turn · judged by ${esc(config.judge_model)} · ${config.backend === "cli" ? "local Claude CLI backend" : "Anthropic API backend"}</p>
    <label>System prompt</label>
    <textarea id="welcome-prompt" placeholder="Optional">${esc(prompt)}</textarea>
    <button class="primary" id="start-btn">Start</button>
    ${state?.session ? ` <button id="welcome-cancel">Cancel</button>` : ""}
  </div>`;
}

function render() {
  const chat = $("#chat");
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
  const s = state?.session;

  if (!s || showWelcome) {
    $("#topbar").innerHTML = "";
    $("#chat-inner").innerHTML = welcomeHtml();
    $("#composer").style.display = "none";
    renderDrawer();
    return;
  }
  $("#composer").style.display = "";
  const openPrompt = $("#topbar details")?.open ? "open" : "";
  // Keep unsaved edits to the system prompt when a poll re-renders the page.
  const draft = $("#system-prompt");
  const promptText = draft && draft.value !== renderedPrompt ? draft.value : s.system_prompt;
  renderedPrompt = s.system_prompt;
  $("#topbar").innerHTML = EXPORT
    ? `<div class="export-note">A recorded <b>reroll</b> session: every reply was sampled ${s.n} times and compared.
        Click the box under a reply to see all the samples.</div>
      <details><summary>${esc(s.model)} · judged by ${esc(s.judge_model)} · system prompt${s.system_prompt ? "" : " (none)"}</summary>
        ${s.system_prompt ? `<div class="prompt">${esc(s.system_prompt)}</div>` : ""}</details>`
    : `<details ${openPrompt}>
    <summary>${esc(s.model)} · n=${s.n} · judge ${esc(s.judge_model)} · ${s.backend === "cli" ? "Claude CLI" : "Anthropic API"} · system prompt${s.system_prompt ? "" : " (none)"}</summary>
    <textarea id="system-prompt">${esc(promptText)}</textarea>
    <button id="save-prompt" ${state.busy ? "disabled" : ""}>Save (applies to the next turns)</button>
  </details>
  ${state.busy || !s.turns.length ? "" : `<a class="button" href="/api/session/export" title="Download a read-only HTML page of this session">Export</a>`}`;
  $("#chat-inner").innerHTML = s.turns.length
    ? s.turns.map(turnHtml).join("")
    : `<p style="color:var(--muted)">Send a message to start.</p>`;
  $("#send-btn").disabled = state.busy;

  if (!EXPORT && (scrollToBottom || nearBottom)) {
    // A reply taller than the screen is shown from its start; otherwise stick to the bottom.
    const last = [...document.querySelectorAll(".assistant")].pop();
    if (last && last.offsetHeight > chat.clientHeight) last.scrollIntoView({ block: "start" });
    else chat.scrollTop = chat.scrollHeight;
  }
  scrollToBottom = false;
  renderDrawer();
}

function renderDrawer() {
  const drawer = $("#drawer");
  const turn = drawerTurn !== null ? state?.session?.turns[drawerTurn] : null;
  if (!turn || showWelcome) {
    drawer.classList.remove("open");
    return;
  }
  const s = state.session;
  const d = turn.divergence;
  const canChoose = drawerTurn === s.turns.length - 1 && !state.busy && !EXPORT;
  let summary = "";
  if (d) {
    summary = `<div class="label spread-${SPREAD_CLASS[turn.spread]}" style="cursor:default">
      ${verdictHtml(turn)}<div class="line">${esc(d.summary)}</div>
      <div class="groups">${d.groups.map((g, gi) => `<div class="group"><span class="chip" style="background:${GROUP_COLORS[gi % GROUP_COLORS.length]}">${letter(gi)}</span>
        ${esc(g.label)} <span class="meta">(replies ${g.members.join(", ")})</span></div>`).join("")}</div>
      ${d.clarification ? `<div class="line"><b>Try adding:</b> <i>${esc(d.clarification)}</i></div>` : ""}
      ${d.sycophancy ? `<div class="line"><span class="syc">Sycophancy?</span> ${esc(d.sycophancy)}</div>` : ""}
    </div>`;
  } else if (turn.judge_error) {
    summary = `<div class="label"><span class="err">Judge failed:</span> ${esc(turn.judge_error)}</div>`;
  } else if (state.busy && drawerTurn === s.turns.length - 1) {
    summary = `<div class="label pending"><span class="dots">${turn.samples.length}/${s.n} samples done</span>
      <span class="meta">· groups appear once all samples are in and judged</span></div>`;
  }
  const cards = turn.samples.map((sample, i) => {
    const g = groupOf(d, i);
    const chip = g ? `<span class="chip" style="background:${GROUP_COLORS[g.index % GROUP_COLORS.length]}">${letter(g.index)}</span>` : "";
    const current = i === turn.chosen && !turn.waiting_for_chosen;
    const action = current ? `<b>${EXPORT ? "shown in the chat" : "current"}</b>` : canChoose ? `<button class="choose" data-index="${i}">Continue with this</button>` : "";
    return `<div class="card ${current ? "current" : ""}">
      <div class="card-head"><span>${chip}Reply ${i + 1}${EXPORT ? "" : ` · ${Math.round(sample.seconds)}s · ${sample.output_tokens} out · ${sample.cache_read_tokens ?? 0} cached · ${sample.cache_write_tokens ?? 0} written`}</span>${action}</div>
      <div class="md">${md(sample.text)}</div>
    </div>`;
  }).join("");
  drawer.innerHTML = `<div class="head"><b>Turn ${drawerTurn + 1}</b><button id="drawer-close">Close (Esc)</button></div>
    <div class="quote">${esc(turn.user_message)}</div>${summary}<div class="cards">${cards}</div>`;
  drawer.classList.add("open");
}

// ---------- actions ----------

async function send() {
  const input = $("#input");
  const text = input.value.trim();
  if (!text) return;
  if (state.busy) return toast("Still sampling the last turn, wait for it to finish.");
  scrollToBottom = true;
  apply(await api("POST", "/api/session/messages", { text }));
  input.value = "";
  autosize(input);
}

function autosize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 2, 240) + "px";
}

document.addEventListener("click", async (e) => {
  const t = e.target;
  const label = t.closest(".label[data-turn]");
  const item = t.closest(".session-item");
  if (t.id === "send-btn") return send();
  if (t.id === "new-btn") { showWelcome = true; drawerTurn = null; return render(); }
  if (t.id === "welcome-cancel") { showWelcome = false; return render(); }
  if (t.id === "start-btn") {
    const data = await api("POST", "/api/sessions", { text: $("#welcome-prompt").value });
    showWelcome = false; editing = false; drawerTurn = null; lastJson = "";
    apply(data);
    return $("#input").focus();
  }
  if (item) {
    const data = await api("POST", `/api/sessions/${item.dataset.id}/open`);
    showWelcome = false; editing = false; drawerTurn = null; lastJson = ""; scrollToBottom = true;
    return apply(data);
  }
  if (t.id === "save-prompt") {
    apply(await api("PUT", "/api/session/system_prompt", { text: $("#system-prompt").value }));
    return toast("System prompt saved. It applies from the next message.");
  }
  if (t.id === "edit-btn") {
    editing = true; render();
    const el = $("#edit-input"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    return;
  }
  if (t.id === "edit-cancel") { editing = false; return render(); }
  if (t.id === "edit-send") {
    const text = $("#edit-input").value;
    editing = false; scrollToBottom = true;
    return apply(await api("POST", "/api/session/edit", { text }));
  }
  if (t.id === "resample-btn") { scrollToBottom = true; return apply(await api("POST", "/api/session/resample")); }
  if (label && !window.getSelection().toString()) { drawerTurn = Number(label.dataset.turn); return renderDrawer(); }
  if (t.id === "drawer-close") { drawerTurn = null; return renderDrawer(); }
  if (t.classList.contains("choose")) {
    apply(await api("POST", "/api/session/choose", { index: Number(t.dataset.index) }));
    drawerTurn = null;
    return renderDrawer();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerTurn !== null) { drawerTurn = null; renderDrawer(); }
});

$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("#input").addEventListener("input", (e) => autosize(e.target));

(async () => {
  if (EXPORT) {
    const s = EXPORT.session;
    document.body.classList.add("export");
    document.title = `reroll: ${s.turns[0]?.user_message.slice(0, 60) ?? "session"}`;
    config = { model: s.model, judge_model: s.judge_model, n: s.n, default_system_prompt: "" };
    state = EXPORT;
    render();
    return;
  }
  config = await api("GET", "/api/config");
  state = await api("GET", "/api/session");
  lastJson = JSON.stringify(state);
  render();
  await loadSessions();
  if (state.busy) refresh();
})();
</script>
</body>
